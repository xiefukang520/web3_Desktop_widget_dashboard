<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景（透明，适配深浅主题） -->
  <circle cx="64" cy="64" r="64" fill="none"/>

  <!-- 区块链外环（12个微型区块） -->
  <g stroke="none" fill="#2D3748" opacity="0.6">
    <!-- 使用 <use> 或循环生成，这里简化为3个示例 -->
    <rect x="32" y="20" width="6" height="6" rx="1"/>
    <rect x="82" y="20" width="6" height="6" rx="1"/>
    <rect x="59" y="10" width="6" height="6" rx="1"/>
    <rect x="20" y="59" width="6" height="6" rx="1"/>
    <rect x="100" y="59" width="6" height="6" rx="1"/>
    <rect x="32" y="92" width="6" height="6" rx="1"/>
    <rect x="82" y="92" width="6" height="6" rx="1"/>
    <!-- 更多区块可程序生成 -->
  </g>

  <!-- 眼睛轮廓（主图形） -->
  <ellipse cx="64" cy="64" rx="32" ry="36" fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <!-- 瞳孔（动态数据流，静态示意） -->
  <path d="M64 48 
           C72 52, 72 60, 64 64 
           C56 60, 56 52, 64 48 Z"
        fill="url(#dataGradient)"/>

  <!-- 数据流动渐变（BTC/ETH/SOL 三色） -->
  <defs>
    <linearGradient id="dataGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7931A"/>
      <stop offset="50%" stop-color="#627EEA"/>
      <stop offset="100%" stop-color="#00FFA3"/>
    </linearGradient>
  </defs>

  <!-- 光点高光（增强活力感） -->
  <circle cx="58" cy="56" r="2" fill="#FFFFFF" opacity="0.8"/>
</svg>